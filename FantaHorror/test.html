<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FANTA Horror — Preview Semua Halaman</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #14121a; color: #fff; font: 14px system-ui, sans-serif; }
    main { display: grid; grid-template-columns: 280px minmax(320px, 540px); gap: 24px; padding: 20px; align-items: start; }
    nav { position: sticky; top: 20px; padding: 16px; border: 1px solid #393246; border-radius: 12px; background: #211d2b; }
    h1 { margin: 0 0 4px; font-size: 20px; }
    p { margin: 0 0 16px; color: #aaa2b8; }
    h2 { margin: 16px 0 7px; color: #9890a8; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; }
    button { width: 100%; margin: 0 0 6px; padding: 9px 11px; border: 1px solid #453d55; border-radius: 7px; background: #2c2638; color: #fff; text-align: left; cursor: pointer; }
    button:hover, button.active { border-color: #fff; background: #393047; }
    iframe { display: block; width: min(540px, calc(100vw - 344px)); aspect-ratio: 6 / 13; border: 1px solid #393246; border-radius: 12px; background: #05020a; }
    @media (max-width: 760px) { main { display: block; padding: 12px; } nav { position: static; margin-bottom: 16px; } iframe { width: 100%; } }
  </style>
</head>
<body>
  <main>
    <nav>
      <h1>Preview Semua Halaman</h1>
      <p>Klik state tanpa perlu memainkan game.</p>
      <h2>Landing & Game</h2>
      <button data-url="index.html?coupon=active&screen=lp">Landing — normal</button>
      <button data-url="index.html?coupon=out&screen=lp">Landing — kupon habis</button>
      <button data-url="index.html?coupon=active&screen=game">Game</button>
      <button data-url="index.html?coupon=active&screen=lp&modal=cara">Popup Cara Bermain</button>
      <h2>Winner</h2>
      <button data-url="index.html?coupon=active&screen=win">Winner — normal</button>
      <button data-url="index.html?coupon=fanta-out&screen=win">Winner — Yakali</button>
      <button data-url="index.html?coupon=out&screen=win">Winner — semua kupon habis</button>
      <h2>Lose</h2>
      <button data-url="index.html?coupon=active&screen=lose">Lose — normal</button>
      <button data-url="index.html?coupon=fanta-out&screen=lose">Lose — Yakali</button>
      <button data-url="index.html?coupon=out&screen=lose">Lose — semua kupon habis</button>
    </nav>
    <iframe id="preview" title="Preview FANTA Horror"></iframe>
  </main>
  <script>
    const preview = document.getElementById('preview');
    const buttons = [...document.querySelectorAll('[data-url]')];
    function openPreview(button) {
      buttons.forEach(item => item.classList.toggle('active', item === button));
      preview.src = `${button.dataset.url}&preview=${Date.now()}`;
    }
    buttons.forEach(button => button.addEventListener('click', () => openPreview(button)));
    openPreview(buttons[0]);
  </script>
</body>
</html>
