<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FANTA Horror — Halaman Testing</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #14121a;
    color: #eee;
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 20px;
  }
  h1 { font-size: 1.25rem; margin-bottom: 4px; }
  .sub { color: #9b96aa; margin-bottom: 18px; font-size: 0.85rem; }

  .wrap { display: flex; gap: 22px; align-items: flex-start; flex-wrap: wrap; }

  .panel {
    width: 290px; flex-shrink: 0;
    background: #1d1a26; border: 1px solid #302b3d;
    border-radius: 10px; padding: 14px;
    position: sticky; top: 20px;
  }
  .panel h2 {
    font-size: 0.7rem; letter-spacing: .09em; text-transform: uppercase;
    color: #8d86a0; margin: 14px 0 7px;
  }
  .panel h2:first-child { margin-top: 0; }

  button.t {
    display: block; width: 100%; text-align: left;
    background: #292336; color: #eee;
    border: 1px solid #3b3550; border-radius: 7px;
    padding: 8px 11px; margin-bottom: 5px;
    cursor: pointer; font-size: 0.84rem;
  }
  button.t:hover { background: #342c45; border-color: #574d75; }
  button.t small { display: block; color: #8f88a5; font-size: 0.72rem; }

  .stage {
    background: #000; border-radius: 12px; overflow: hidden;
    border: 1px solid #302b3d; flex-shrink: 0;
  }
  iframe { width: 420px; height: 910px; border: 0; display: block; }

  #state {
    margin-top: 12px; padding: 9px 11px; border-radius: 7px;
    background: #12101a; border: 1px solid #2b2637;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 0.74rem; color: #b9b2cc; white-space: pre-wrap;
  }
  .note {
    margin-top: 10px; font-size: 0.73rem; color: #8f88a5;
    border-left: 2px solid #4a4160; padding-left: 8px;
  }
</style>
</head>
<body>

<h1>FANTA Horror — Halaman Testing</h1>
<p class="sub">Klik untuk melompat ke state mana pun tanpa menunggu API atau memainkan gamenya.</p>

<div class="wrap">
  <div class="panel">
    <h2>Landing Page</h2>
    <button class="t" data-do="lpFull">LP — Desktop (kunjungan 1)<small>MAIN GAME + UPLOAD STRUK</small></button>
    <button class="t" data-do="lpCompact">LP — HP / setelah reload<small>CARA BERMAIN + MAIN GAME</small></button>
    <button class="t" data-do="lpCouponOut">LP — Kupon habis<small>upload struk hilang</small></button>

    <h2>Game</h2>
    <button class="t" data-do="game">Mulai game<small>1 sesi = 5 botol, 1 tangan</small></button>
    <button class="t" data-do="wave">Munculkan 1 sesi (timer mati)<small>untuk melihat botol &amp; tangan</small></button>
    <button class="t" data-do="steal">Simulasi botol dicuri<small>cek animasi hilang di depan kubur</small></button>

    <h2>Winner</h2>
    <button class="t" data-do="winNormal">Winner — normal<small>AMBIL VOUCHER DI SINI</small></button>
    <button class="t" data-do="winVoucherOut">Winner — voucher Fanta habis<small>YAKALI GAK MAU FANTA (abu)</small></button>
    <button class="t" data-do="winCouponOut">Winner — kupon habis<small>tanpa tombol voucher</small></button>

    <h2>Lose</h2>
    <button class="t" data-do="loseNormal">Lose — normal</button>
    <button class="t" data-do="loseVoucherOut">Lose — voucher Fanta habis</button>
    <button class="t" data-do="loseCouponOut">Lose — kupon habis</button>

    <h2>Lain-lain</h2>
    <button class="t" data-do="caraBermain">Popup Cara Bermain</button>
    <button class="t" data-do="share">Tes tombol Share<small>lihat hasilnya di bawah</small></button>
    <button class="t" data-do="reload">Muat ulang game</button>

    <div id="state">memuat…</div>
    <p class="note">Halaman ini hanya alat bantu internal — tidak dipakai di produksi. Hapus <code>test.html</code> sebelum rilis kalau tidak diperlukan.</p>
  </div>

  <div class="stage"><iframe id="app" src="index.html"></iframe></div>
</div>

<script>
const frame = document.getElementById('app');
const stateBox = document.getElementById('state');
const win = () => frame.contentWindow;
const doc = () => frame.contentDocument;
const game = () => win().fantaGame;

// The quota check runs on load and would overwrite whatever state we force,
// so each action re-applies its own flags afterwards.
function setQuota(cinema, fanta) {
  const g = game();
  g.cinemaAvailable = cinema;
  g.fantaAvailable = fanta;
  g.applyQuotaUI();
}

const actions = {
  lpFull() {
    setQuota(true, true);
    doc().getElementById('screen-lp').classList.remove('lp-compact-mode');
    game().switchScreen('LP');
  },
  lpCompact() {
    setQuota(true, true);
    doc().getElementById('screen-lp').classList.add('lp-compact-mode');
    game().switchScreen('LP');
  },
  lpCouponOut() {
    setQuota(false, false);
    game().switchScreen('LP');
  },
  game() { setQuota(true, true); game().startGame(); },
  wave() {
    const g = game();
    g.startGame();
    win().clearInterval(g.timerInterval);
    win().clearInterval(g.stingerInterval);
    win().clearInterval(g.spawnerInterval);
    g.clearAllSlots();
    g.spawnSession();
  },
  steal() {
    const g = game();
    g.startGame();
    win().clearInterval(g.timerInterval);
    win().clearInterval(g.stingerInterval);
    win().clearInterval(g.spawnerInterval);
    g.clearAllSlots();
    const s = g.slots[4];
    g.spawnBottle(s, true);
    win().clearTimeout(s.attackTimeout);
    g.transitionToSuzzannaAttack(s);
    win().clearTimeout(s.stealTimeout);
    win().setTimeout(() => g.handleSuzzannaSteal(s), 700);
  },
  winNormal()      { setQuota(true, true);   game().switchScreen('WIN'); },
  winVoucherOut()  { setQuota(true, false);  game().switchScreen('WIN'); },
  winCouponOut()   { setQuota(false, false); game().switchScreen('WIN'); },
  loseNormal()     { setQuota(true, true);   game().switchScreen('LOSE'); },
  loseVoucherOut() { setQuota(true, false);  game().switchScreen('LOSE'); },
  loseCouponOut()  { setQuota(false, false); game().switchScreen('LOSE'); },
  caraBermain()    { game().switchScreen('LP'); game().showModal('caraBermain'); },
  share()          { game().shareGame(); },
  reload()         { frame.src = 'index.html?t=' + Date.now(); }
};

document.querySelectorAll('button.t').forEach(b => {
  b.addEventListener('click', () => {
    try { actions[b.dataset.do](); } catch (e) { alert('Gagal: ' + e.message); }
    setTimeout(report, 60);
  });
});

function report() {
  try {
    const g = game(), d = doc();
    const cls = id => {
      const el = d.getElementById(id);
      const c = [...el.classList].filter(x => x !== 'screen').join(' ');
      return c || '(normal)';
    };
    const vis = sel => {
      const el = d.querySelector(sel);
      if (!el) return 'tidak ada';
      const cs = win().getComputedStyle(el);
      if (cs.display === 'none' || el.classList.contains('hidden')) return 'disembunyikan';
      const resultScreen = el.closest('.screen');
      return resultScreen?.classList.contains('voucher-out')
        ? 'YAKALI GAK MAU FANTA (abu)'
        : 'AMBIL VOUCHER DI SINI';
    };
    stateBox.textContent =
      `layar     : ${g.gameState}\n` +
      `cinema    : ${g.cinemaAvailable}\n` +
      `fanta     : ${g.fantaAvailable}\n` +
      `#screen-lp: ${cls('screen-lp')}\n` +
      `#screen-win: ${cls('screen-win')}\n` +
      `CTA winner: ${vis('.btn-ambil-voucher-win')}\n` +
      `nyawa     : ${g.health}   sisa waktu: ${g.timer}s`;
  } catch (e) {
    stateBox.textContent = 'menunggu game siap…';
  }
}

frame.addEventListener('load', () => setTimeout(report, 500));
setInterval(report, 1000);
</script>
</body>
</html>
