<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FANTA Horror Gamification - Gebuk Suzzanna, Amankan Fantamu!</title>
  <meta name="description" content="Mainkan game FANTA Horror! Lindungi botol Fanta dari cegatan tangan Suzzanna selama 30 detik untuk memenangkan voucher nonton bioskop eksklusif!">
  
  <link rel="stylesheet" href="index.css?v=20260801-gamefix">
</head>
<body>

  <div id="app-container" class="quota-loading">

    <!-- Floating Top Control Bar -->
    <div class="top-controls-bar">
      <button id="quota-toggle-btn" class="icon-btn" title="Toggle Quota Active / Habis untuk Demo">
        ⚡ QUOTA TOGGLE
      </button>
      <button id="audio-toggle-btn" class="icon-btn" aria-label="Mute / Unmute Audio">
        🔊 MUSIK & SFX
      </button>
    </div>

    <!-- 1. LANDING PAGE (LP) -->
    <section id="screen-lp" class="screen">
      <div class="lp-header">
        <img src="assets/crop_lp_header.webp" alt="Yakali Gamau Pilih? FANTA Horror Game">
      </div>

      <!--
        One set of buttons for both landing variants.
        In the full desktop view these are invisible hotspots (opacity 0) sitting on top of
        the pink/blue cards already painted into the background artwork. Only the compact
        view (mobile / any reload) reveals them, and there they are pill-shaped -- hence the
        pill artwork below rather than the square cards.
      -->
      <div class="lp-actions">
        <button id="btn-main-game" class="img-btn">
          <img src="assets/Button-Main Game-Medium.webp" alt="Main Game">
        </button>
        <button id="btn-upload-struk" class="img-btn">
          <img src="assets/Button-Upload struk.webp" alt="Upload Struk &amp; Ambil Vouchernya">
        </button>
      </div>

      <div class="lp-footer">
        <button id="btn-cara-bermain" class="btn-link">
          <img src="assets/Button-Cara bermain-Medium.webp" alt="Cara Bermain">
        </button>
        <p class="tnc-text">*syarat &amp; ketentuan berlaku</p>
      </div>
    </section>

    <!-- 2. VOUCHER SELECTION SCREEN -->
    <section id="screen-voucher-select" class="screen hidden">
      <div class="voucher-header">
        <img src="assets/crop_select_voucher_header.webp" alt="Pilih Voucher Dulu Yuk">
      </div>

      <div class="voucher-grid">
        <div class="voucher-card" data-voucher="CGV">
          <img src="assets/crop_voucher_cgv_active.webp" alt="CGV 50% discount for cinema + 1 free Fanta">
        </div>
        <div class="voucher-card" data-voucher="CINEPOLIS">
          <img src="assets/crop_voucher_cinepolis_active.webp" alt="Cinépolis Buy 1 Get 1 cinema voucher + 1 free Fanta">
        </div>
        <div class="voucher-card voucher-card-center" data-voucher="XXI">
          <img src="assets/crop_voucher_xxi_active.webp" alt="XXI 25k discount for cinema + free 1 Fanta">
        </div>
      </div>
    </section>

    <!-- 3. GAME ARENA SCREEN -->
    <section id="screen-game" class="screen hidden">
      <div class="game-header-panel">
        <div id="health-bar" class="health-bar-container">
          <!-- Render 5 health bottle icons dynamically -->
        </div>
        <div class="timer-box">
          <span id="timer-display" class="timer-val">30s</span>
        </div>
      </div>

      <div id="graves-grid" class="graves-grid-container">
        <!-- 3x3 Graves slots dynamically rendered in JS -->
      </div>
    </section>

    <!-- 4. WINNER SCREEN -->
    <section id="screen-win" class="screen hidden">
      <div class="result-header">
        <img src="assets/crop_winner_header.webp" alt="Emang Paling Gercep, Fanta Aman">
      </div>

      <div class="result-actions">
        <div class="result-row-btn">
          <button class="img-btn btn-share">
            <img class="normal-result-art" src="assets/Button-Share.webp" alt="Share">
            <img class="coupon-out-action-art" src="assets/SHARE.webp" alt="Share">
          </button>
          <button class="img-btn btn-main-lagi">
            <img class="normal-result-art" src="assets/Button-Main Lagi-Medium.webp" alt="Main Lagi">
            <img class="coupon-out-action-art" src="assets/MAIN LAGI.webp" alt="Main Lagi">
          </button>
        </div>
        <button class="img-btn btn-ambil-voucher btn-ambil-voucher-win">
          <img class="normal-result-art" src="assets/Button-Ambil Coucher disini.webp" alt="Ambil Voucher Di Sini">
          <!-- Swapped in when the Fanta campaign is out; the winner artwork paints no CTA. -->
          <img class="voucher-out-art" src="assets/yakali.webp" alt="Yakali Gak Mau Fanta">
        </button>
      </div>
    </section>

    <!-- 5. LOSE SCREEN -->
    <section id="screen-lose" class="screen hidden">
      <div class="result-header">
        <img src="assets/crop_lose_header.webp" alt="Haussss... Yah Fantanya Udah Habis!">
      </div>

      <div class="result-actions">
        <div class="result-row-btn">
          <button class="img-btn btn-share">
            <img class="normal-result-art" src="assets/crop_btn_share_lose.webp?v=20260801" alt="Share">
            <img class="coupon-out-action-art" src="assets/SHARE.webp" alt="Share">
          </button>
          <button class="img-btn btn-main-lagi">
            <img class="normal-result-art" src="assets/Button-Main Lagi-Medium-Red.webp" alt="Main Lagi">
            <img class="coupon-out-action-art" src="assets/MAIN LAGI.webp" alt="Main Lagi">
          </button>
        </div>
        <button class="img-btn btn-ambil-voucher btn-ambil-voucher-lose">
          <img class="normal-result-art" src="assets/Button-Ambil Coucher disini-Red.webp" alt="Ambil Voucher Di Sini">
          <!-- Swapped in when the Fanta campaign is out; the lose artwork paints no CTA. -->
          <img class="voucher-out-art" src="assets/yakali.webp" alt="Yakali Gak Mau Fanta">
        </button>
      </div>
    </section>

    <!-- MODAL: CARA BERMAIN -->
    <div id="modal-cara-bermain" class="modal-overlay hidden">
      <div class="modal-cara-bermain-box">
        <img class="cara-bermain-popup-img" src="assets/POP-UP-CARA BERMAIN.webp" alt="Cara bermain FANTA Horror Game">
        <button id="btn-close-cara-bermain" class="btn-tutup-green" aria-label="Tutup cara bermain"></button>
      </div>
    </div>

  </div>

  <script src="js/sound.js?v=20260801-tnc"></script>
  <script src="js/game.js?v=20260801-gamefix2"></script>
</body>
</html>
